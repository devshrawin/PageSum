<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PageSum</title>
  <link rel="stylesheet" href="sidepanel.css">
</head>
<body>
  <header>
    <h1 id="pageTitle" class="page-title">PageSum</h1>
    <button id="settingsBtn" type="button" class="icon-btn settings-btn" aria-label="Open settings" title="Settings">&#9881;</button>
  </header>

  <div id="notices" class="notices"></div>

  <main id="content">
    <div id="panel-page" class="panel">
      <section id="view-init" class="view">
        <div class="spinner" aria-hidden="true"></div>
        <p class="center">Reading page&hellip;</p>
        <p class="center static-working">Working&hellip;</p>
      </section>

      <section id="view-needKey" class="view" hidden>
        <h2>Add your Gemini API key</h2>
        <ol class="steps">
          <li>Open <a href="https://aistudio.google.com/apikey" target="_blank" rel="noopener noreferrer">aistudio.google.com/apikey</a></li>
          <li>Click "Create API key"</li>
          <li>Paste it below</li>
        </ol>
        <div class="row">
          <input id="keyInput" type="password" autocomplete="off" spellcheck="false" aria-label="Gemini API key" placeholder="AIza...">
          <button id="keyShow" type="button" class="btn">Show</button>
        </div>
        <div class="row">
          <button id="keySave" type="button" class="btn primary">Save</button>
          <button id="moreSettings" type="button" class="link-btn">More settings</button>
        </div>
        <p id="keyMsg" class="msg" role="alert"></p>
        <p class="muted small">Stored unencrypted in this browser on this device. Only sent to Google.</p>
      </section>

      <section id="view-restricted" class="view center" hidden>
        <div class="big-icon" aria-hidden="true">&#128274;</div>
        <p id="restrictedText"></p>
      </section>

      <section id="view-needAccess" class="view center" hidden>
        <div class="big-icon" aria-hidden="true">&#128273;</div>
        <p id="needAccessTitle">PageSum can't read this tab yet.</p>
        <div class="actions">
          <button id="allowSiteBtn" type="button" class="btn primary">Allow on this site</button>
          <button id="allowAllBtn" type="button" class="btn">Allow on all sites</button>
        </div>
        <p id="needAccessHint" class="muted small"></p>
      </section>

      <section id="view-empty" class="view center" hidden>
        <p>Not enough readable text on this page.</p>
        <button id="tryAnyway" type="button" class="btn">Try anyway</button>
      </section>

      <section id="view-idle" class="view center" hidden>
        <button id="summariseBtn" type="button" class="btn primary">Summarise this page</button>
      </section>

      <section id="view-summary" class="view" hidden>
        <div class="card">
          <div class="toolbar">
            <div id="lengthGroup" class="seg" role="radiogroup" aria-label="Summary length">
              <button type="button" role="radio" data-length="short" aria-checked="false" tabindex="-1">Short</button>
              <button type="button" role="radio" data-length="medium" aria-checked="true" tabindex="0">Medium</button>
              <button type="button" role="radio" data-length="detailed" aria-checked="false" tabindex="-1">Detailed</button>
            </div>
            <button id="regenBtn" type="button" class="icon-btn" aria-label="Regenerate summary" title="Regenerate">&#8635;</button>
            <button id="copyBtn" type="button" class="icon-btn text" aria-label="Copy summary" title="Copy"><span id="copyLabel">&#10697;</span></button>
            <button id="stopBtn" type="button" class="icon-btn" aria-label="Stop generating" title="Stop" hidden>&#9632;</button>
          </div>
          <div id="summaryBody" class="md" aria-busy="false"></div>
          <div id="summaryError" hidden></div>
        </div>
        <div id="chat" class="chat"></div>
      </section>
    </div>
  </main>

  <footer id="footer" hidden>
    <div class="ask">
      <textarea id="question" rows="1" placeholder="Ask about this page&hellip;" aria-label="Ask about this page"></textarea>
      <button id="sendBtn" type="button" class="btn primary">Send</button>
    </div>
    <div class="meta">
      <span id="modelLabel" class="muted small"></span>
      <button id="newChatBtn" type="button" class="link-btn small">New chat</button>
    </div>
  </footer>

  <div id="status" class="sr-only" role="status" aria-live="polite"></div>
  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
  <script type="module" src="sidepanel.js"></script>
</body>
</html>
